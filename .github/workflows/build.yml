name: build

on:
  push:
    branches: [main]
    paths: ['homebrew/**', '.github/workflows/build.yml']
  pull_request:
    paths: ['homebrew/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make -C homebrew
      - uses: actions/upload-artifact@v4
        with:
          name: elf
          path: |
            homebrew/3ds-wrapped.3dsx
            homebrew/3ds-wrapped.elf

  # makerom needs a newer glibc than the devkitARM image, so the .cia is packed on the runner itself
  cia:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: elf
          path: homebrew
      - name: Install bannertool and makerom
        run: |
          mkdir -p /tmp/tools && cd /tmp/tools
          curl -sSL -o bannertool.zip https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip
          curl -sSL -o makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip
          unzip -q -o bannertool.zip -d bannertool && unzip -q -o makerom.zip -d makerom
          sudo install -m 755 "$(find bannertool -path '*linux-x86_64*' -name bannertool -type f | head -n1)" /usr/local/bin/bannertool
          sudo install -m 755 "$(find makerom -name makerom -type f | head -n1)" /usr/local/bin/makerom
      - name: Pack .cia
        working-directory: homebrew
        run: |
          mkdir -p build
          bannertool makebanner -i banner.png -a banner.wav -o build/banner.bnr
          bannertool makesmdh -s "3DS Wrapped" -l "Tu resumen anual de juego" -p "P0tzz" -i icon.png -o build/icon.icn
          makerom -f cia -o 3ds-wrapped.cia -elf 3ds-wrapped.elf -rsf app.rsf -target t -exefslogo \
            -banner build/banner.bnr -icon build/icon.icn
          ls -l 3ds-wrapped.cia
      - uses: actions/upload-artifact@v4
        with:
          name: 3ds-wrapped
          path: |
            homebrew/3ds-wrapped.3dsx
            homebrew/3ds-wrapped.cia

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build host tool
        working-directory: homebrew
        run: gcc -Wall -Werror -O2 -Isource source/pld.c tests/pld_url.c -o pld_url
      - name: Run on fixture
        working-directory: homebrew
        run: ./pld_url tests/fixture-pld.bin | tee links.txt
      - uses: actions/upload-artifact@v4
        with:
          name: links
          path: homebrew/links.txt

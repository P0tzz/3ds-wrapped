name: build

on:
  push:
    branches: [main]
    paths: ['homebrew/**', '.github/workflows/build.yml']
  pull_request:
    paths: ['homebrew/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make -C homebrew
      - uses: actions/upload-artifact@v4
        with:
          name: 3ds-wrapped
          path: homebrew/3ds-wrapped.3dsx

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build host tool
        working-directory: homebrew
        run: gcc -Wall -Werror -O2 -Isource source/pld.c tests/pld_url.c -o pld_url
      - name: Run on fixture
        working-directory: homebrew
        run: ./pld_url tests/fixture-pld.bin | tee links.txt
      - uses: actions/upload-artifact@v4
        with:
          name: links
          path: homebrew/links.txt

name: build

on:
  push:
    branches: [main]
    paths: ['homebrew/**', '.github/workflows/build.yml']
  pull_request:
    paths: ['homebrew/**']
  workflow_dispatch:

jobs:
  3dsx:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make -C homebrew
      - uses: actions/upload-artifact@v4
        with:
          name: 3ds-wrapped
          path: homebrew/3ds-wrapped.3dsx
